name: 🛰️ Tour Date Scraper

on:
  workflow_dispatch:  # Manual trigger
  schedule:
    - cron: "0 1 * * * 3,5,0"  # Runs every Monday, Wednesday, Friday, and Sunday at 01:00 UTC

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🧩 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 🧱 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧰 Install Chrome and ChromeDriver
        run: |
          sudo apt-get update --fix-missing || true
          sudo apt-get install -y --no-install-recommends chromium-browser chromium-chromedriver || sudo apt-get install -y --no-install-recommends chromium chromedriver
          which chromium-browser || which chromium || echo "Chromium not found"
          which chromedriver || echo "Chromedriver not found"
          continue-on-error: true

      - name: ⚙️ Run Tour Scraper
        working-directory: /home/runner/work/${{ github.event.repository.name }}/${{ github.event.repository.name }}
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          TOUR_URL_1: ${{ secrets.TOUR_URL_1 }}
          TOUR_URL_2: ${{ secrets.TOUR_URL_2 }}
          TOUR_URL_3: ${{ secrets.TOUR_URL_3 }}
          TOUR_URL_4: ${{ secrets.TOUR_URL_4 }}
          LOG_LEVEL: "INFO"
          PYTHONUNBUFFERED: 1
          CHROME_BIN: /usr/bin/chromium-browser
          CHROMEDRIVER_PATH: /usr/bin/chromedriver
        run: |
          echo "=== Current Working Directory ==="
          pwd
          echo "=== Repository Files ==="
          ls -la
          echo "=== Starting Tour Scraper ==="
          python tour_scraper.py

      - name: 📦 Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-logs
          path: logs/
